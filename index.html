<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
</head><body>
<title>10월 모의고사 대학 라인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: OMR 답안지처럼 왼쪽 점수 기입란 + 오른쪽 대학 라인 목록, 좁으면 한 줄로 쌓임 */
:root{
  --paper:#f7f5f6; --card:#ffffff; --ink:#1d2230; --muted:#626877; --line:#e3dde1;
  --omr:#c4334a; --omr-soft:#fbe9ec; --omr-line:#efc3cb;
  --safe:#1f7a4d; --safe-bg:#e3f3ea; --fit:#2357b8; --fit-bg:#e5edfb;
  --try:#a8650a; --try-bg:#fbf0dc; --reach:#b42a3c; --reach-bg:#fbe6e9;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15171d; --card:#1d2029; --ink:#e9e7ec; --muted:#a0a4b0; --line:#30333e;
  --omr:#f0687c; --omr-soft:#3a2129; --omr-line:#5c2f39;
  --safe:#6fd19c; --safe-bg:#1b3328; --fit:#86a9f0; --fit-bg:#1e2a45;
  --try:#eab35d; --try-bg:#3a2d16; --reach:#f08593; --reach-bg:#3c1f25; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15171d; --card:#1d2029; --ink:#e9e7ec; --muted:#a0a4b0; --line:#30333e;
  --omr:#f0687c; --omr-soft:#3a2129; --omr-line:#5c2f39;
  --safe:#6fd19c; --safe-bg:#1b3328; --fit:#86a9f0; --fit-bg:#1e2a45;
  --try:#eab35d; --try-bg:#3a2d16; --reach:#f08593; --reach-bg:#3c1f25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--omr);padding-bottom:14px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--omr);font-weight:700}
h1{margin:2px 0 0;font-size:clamp(22px,3.4vw,30px);font-weight:700;text-wrap:balance}
.tabs{display:flex;gap:0;border:1.5px solid var(--omr);border-radius:9px;overflow:hidden}
.tabs button{border:0;border-radius:0;padding:8px 18px;font:700 15px var(--sans);background:var(--card);color:var(--omr)}
.tabs button+button{border-left:1.5px solid var(--omr)}
.tabs button[aria-pressed="true"]{background:var(--omr);color:var(--card)}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.sheet{border:1.5px solid var(--omr-line)}
.sheet h2,.res h2{margin:0 0 4px;font-size:16px}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.mode{display:flex;gap:6px;margin:0 0 12px}
.mode button{padding:5px 11px;font-size:12.5px;border-radius:999px}
.mode button[aria-pressed="true"]{background:var(--omr-soft);border-color:var(--omr);color:var(--omr);font-weight:700}
table.omr{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.omr th{font-size:12px;font-weight:500;color:var(--omr);background:var(--omr-soft);padding:6px 4px;border:1px solid var(--omr-line)}
table.omr td{border:1px solid var(--omr-line);padding:6px 6px;text-align:center}
table.omr td.sub{text-align:left;font-weight:700}
table.omr td.sub small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
table.omr td.sub select{display:block;width:100%;margin-top:3px;font:500 12.5px var(--sans);padding:3px 4px;border:1px solid var(--omr-line);border-radius:5px;background:var(--paper);color:var(--ink)}
table.omr input{width:62px;font:600 16px var(--mono);text-align:center;padding:5px 2px;border:1.5px solid var(--omr-line);border-radius:6px;background:var(--paper);color:var(--ink)}
table.omr input:focus{outline:2px solid var(--omr);outline-offset:1px}
table.omr input.bad{border-color:var(--reach);background:var(--reach-bg)}
td.num{font-family:var(--mono);font-size:14px}
.gr{display:inline-block;min-width:26px;padding:1px 6px;border-radius:999px;font:600 12.5px var(--mono);background:var(--omr-soft);color:var(--omr)}
.warn{font-size:12.5px;color:var(--reach);margin:8px 0 0}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--omr-soft)}
.total span{font-size:13px;color:var(--omr);font-weight:700}
.total b{font:600 30px var(--mono);color:var(--omr)}
.total em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:500 13px var(--sans);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--omr)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--omr);outline-offset:1px}
.sample{font-size:12px;color:var(--try);background:var(--try-bg);border-radius:6px;padding:6px 10px;margin:0 0 12px}
.legend{font-size:12.5px;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.legend div{display:flex;gap:8px;align-items:center;margin:3px 0}
.res{min-width:0}
.bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 14px}
@media (max-width:520px){.bands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.band{border:1.5px solid transparent;border-radius:9px;padding:9px 10px;text-align:left;cursor:pointer}
.band .bn{font-size:13px;font-weight:700}
.band .bc{font:600 22px var(--mono)}
.band .br{font-size:11.5px;color:var(--muted)}
.band[aria-pressed="false"]{opacity:.45}
.b-safe{background:var(--safe-bg);color:var(--safe)} .b-fit{background:var(--fit-bg);color:var(--fit)}
.b-try{background:var(--try-bg);color:var(--try)} .b-reach{background:var(--reach-bg);color:var(--reach)}
.band.b-safe{border-color:var(--safe)} .band.b-fit{border-color:var(--fit)} .band.b-try{border-color:var(--try)} .band.b-reach{border-color:var(--reach)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input[type=search]{font:14px var(--sans);padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.filters input[type=search]{flex:1 1 160px;min-width:0}
.chk{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center}
.regions{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.regions button{padding:3px 9px;font-size:12.5px;border-radius:999px}
.regions button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
table.list{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:640px}
table.list th{background:var(--card);text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list td.r,table.list th.r{text-align:right;font-family:var(--mono)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.u{font-weight:700}
.dept small{display:block;color:var(--muted);font-size:11.5px}
.meta{color:var(--muted);font-size:12.5px;white-space:nowrap}
.diff{font-weight:600}
.count{font-size:13px;color:var(--muted);margin-top:10px}
.more{display:block;margin:12px auto 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.7}
</style>

<div class="wrap">
<style>.sitenav{display:flex;gap:6px;margin-bottom:14px}.sitenav a{font:700 13.5px var(--sans);text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--card)}.sitenav a[aria-current="page"]{color:var(--card);background:var(--ink);border-color:var(--ink)}.sitenav a:focus-visible{outline:2px solid var(--omr);outline-offset:1px}</style><nav class="sitenav" aria-label="메뉴"><a href="./" aria-current="page">모의고사 (정시)</a><a href="naesin.html">내신 (수시)</a></nav>
<header>
  <div>
    <div class="eyebrow">2026년 10월 20일 시행 · 전국연합학력평가</div>
    <h1 id="title">10월 모의고사 대학 라인</h1>
  </div>
  <div class="tabs" id="gradeTabs" role="group" aria-label="학년">
    <button type="button" data-g="고1">고1</button><button type="button" data-g="고2">고2</button><button type="button" data-g="고3">고3</button>
  </div>
</header>

<div class="grid">
  <section class="panel sheet" aria-labelledby="h-sheet">
    <h2 id="h-sheet">점수 기입란</h2>
    <p class="hint" id="sheetHint"></p>
    <div class="mode" role="group" aria-label="입력 방식">
      <button type="button" data-m="raw" aria-pressed="true">원점수로 입력</button>
      <button type="button" data-m="std" aria-pressed="false">표준점수로 입력</button>
    </div>
    <p class="sample" id="sampleNote">예시 점수가 들어가 있어요. 내 점수로 바꿔 입력하세요.</p>
    <table class="omr">
      <thead><tr><th>과목</th><th id="inHead">원점수</th><th id="outHead">표준</th><th>백분위</th><th>등급</th></tr></thead>
      <tbody id="omrBody"></tbody>
    </table>
    <p class="warn" id="dupWarn" hidden>탐구 두 과목이 같아요. 다른 과목을 골라 주세요.</p>
    <div class="total"><span>표준점수 합<br><em id="sumLabel"></em></span><b id="sum">–</b></div>
    <div class="btns"><button type="button" id="clearBtn">모두 지우기</button><button type="button" id="sampleBtn">예시 점수 넣기</button></div>
    <div class="legend">
      <div><span class="pill b-safe">안정</span>내 점수가 지원가능점수보다 6점 이상 높음</div>
      <div><span class="pill b-fit">적정</span>0 ~ +5점</div>
      <div><span class="pill b-try">소신</span>−1 ~ −5점</div>
      <div><span class="pill b-reach">상향</span>−6 ~ −10점</div>
    </div>
  </section>

  <section class="res" aria-labelledby="h-res">
    <div class="panel">
      <h2 id="h-res">지원 가능 대학</h2>
      <p class="hint" id="resHint"></p>
      <div class="bands" id="bands"></div>
      <div class="filters">
        <select id="fK" aria-label="계열"><option value="">계열 전체</option><option value="0">인문</option><option value="1">자연</option><option value="2">공통</option></select>
        <select id="fG" aria-label="모집군"><option value="">군 전체</option><option value="0">가군</option><option value="1">나군</option><option value="2">다군</option></select>
        <input type="search" id="fQ" placeholder="대학·학과 검색 (예: 간호, 숭실대)" aria-label="대학·학과 검색">
        <label class="chk"><input type="checkbox" id="fFar"> 안정권 전부 보기</label>
      </div>
      <div class="regions" id="regions" aria-label="지역"></div>
    </div>
    <div class="count" id="count"></div>
    <div class="tablewrap">
      <table class="list">
        <thead><tr><th>판정</th><th>대학</th><th>모집단위</th><th>군</th><th>계열</th><th>지역</th><th class="r">인원</th><th class="r">지원가능</th><th class="r">차이</th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <button type="button" class="more" id="moreBtn" hidden>더 보기</button>
  </section>
</div>

<footer id="foot"></footer>

const MODELS = {};
function model(grade, key, max) {
  const id = grade+'|'+key;
  if (MODELS[id]) return MODELS[id];
  const cut = DATA.cuts[grade][key];
  // 원점수→표준: 컷 점을 잇는 꺾은선, 1등급컷 위는 전체 직선식 기울기로 연장
  let sx=0, sy=0, sxx=0, sxy=0; const n = cut.length;
  for (const [x,y] of cut) { sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }
  const slope = (n*sxy - sx*sy) / (n*sxx - sx*sx);
  const top = cut[0];
  const stdPts = [[max, top[1] + (max-top[0])*slope], ...cut.map(c=>[c[0],c[1]])];
  const pctPts = [[max,100], ...cut.slice(0,8).map(c=>[c[0],c[2]]), [0,0]];
  // 표준→백분위(표준점수 입력용)
  const stdPct = [[stdPts[0][1],100], ...cut.slice(0,8).map(c=>[c[1],c[2]]), [cut[8][1],0]];
  return MODELS[id] = {cut, stdPts, pctPts, stdPct, maxStd: Math.round(stdPts[0][1])};
}
function interp(pts, x) { // pts: x 내림차순
  if (x >= pts[0][0]) return pts[0][1];
  for (let i=0;i<pts.length-1;i++) {
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    if (x <= x1 && x >= x2) return x1===x2 ? Math.max(y1,y2) : y2 + (x-x2)*(y1-y2)/(x1-x2);
  }
  return pts[pts.length-1][1];
}
function fromRaw(m, raw) {
  let grade = 9; for (let i=0;i<8;i++) if (raw >= m.cut[i][0]) { grade=i+1; break; }
  return {std: Math.round(interp(m.stdPts, raw)), pct: Math.round(interp(m.pctPts, raw)), grade};
}
function fromStd(m, std) {
  let grade = 9; for (let i=0;i<8;i++) if (std >= m.cut[i][1]) { grade=i+1; break; }
  return {std, pct: Math.round(interp(m.stdPct, std)), grade};
}

    R.map((r,i)=>`<button type="button" data-r="${i}" aria-pressed="false">${r}</button>`).join('');
  const T = DATA.grades[grade];
  $('foot').innerHTML = `등급컷: 대성마이맥 ${grade} 예상 등급컷(네이버 제공, ${DATA.updated[grade]} 업데이트). 원점수는 등급컷 점을 잇는 선으로 표준점수·백분위를 환산한 추정값입니다${grade==='고3'?' (국어·수학은 공통·선택 점수 구성에 따라 실제와 1~2점 다를 수 있음)':''}.<br>
    대학별 지원가능점수: ${G.table}, ${G.tableNote}, ${T.rows.length.toLocaleString()}개 모집단위. 9월 배치표에 10월 점수를 넣은 참고용 결과이며 실제 입시 결과와 다를 수 있습니다.`;
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m===m)));
  $('inHead').textContent = m==='raw' ? '원점수' : '표준점수';
  $('outHead').textContent = m==='raw' ? '표준' : '–';
}

function readSheet() {
  const G = GRADES[grade];
  return {mode, vals: G.subs.map((_,i)=>$('in'+i).value), sel: G.subs.map((_,i)=>$('sel'+i)?.value ?? null)};
}
function writeSheet(st) {
  const G = GRADES[grade];
  setMode(st?.mode || 'raw');
  G.subs.forEach((_,i) => {
    $('in'+i).value = st?.vals?.[i] ?? '';
    if ($('sel'+i) && st?.sel?.[i]) $('sel'+i).value = st.sel[i];
  });
  recalc();
}
function sampleState() {
  const G = GRADES[grade];
  return {mode:'raw', vals: G.sample.raw.map(String), sel: G.sample.sel || G.subs.map(()=>null)};
}

function recalc() {
  const G = GRADES[grade];
  let sum = 0, complete = true;
  const picks = [];
  G.subs.forEach((s,i) => {
    const key = $('sel'+i)?.value ?? s.opts[0];
    picks.push(key);
    const m = model(grade, key, s.max);
    const el = $('in'+i), v = el.value.trim(), x = v==='' ? NaN : Number(v);
    const hi = mode==='raw' ? s.max : m.maxStd + 5;
    const step = mode==='raw' ? s.step : 1;
    const ok = !isNaN(x) && x >= 0 && x <= hi && Math.abs(x/step - Math.round(x/step)) < 1e-9;
    el.min = 0; el.max = hi; el.step = step;
    el.classList.toggle('bad', v!=='' && !ok);
    if (!ok) { complete = false; ['out','pct','gr'].forEach(p => $(p+i).textContent = '–'); return; }
    const r = mode==='raw' ? fromRaw(m, x) : fromStd(m, x);
    $('out'+i).textContent = mode==='raw' ? r.std : '';
    $('pct'+i).textContent = r.pct;
    $('gr'+i).innerHTML = `<span class="gr">${r.grade}</span>`;
    sum += r.std;
  });
  const dup = grade==='고3' && picks[2]===picks[3];
  $('dupWarn').hidden = !dup;
  if (dup) complete = false;
  total = complete ? sum : null;
  $('sum').textContent = complete ? sum : '–';
  store.set('univline-'+grade, readSheet());
  shown = PAGE; renderList();
}

function renderList() {
  const T = DATA.grades[grade];
  const body = $('listBody'), more = $('moreBtn');
  if (total === null) {
    $('resHint').textContent = '모든 과목 점수를 입력하면 대학 라인이 나와요.';
    $('bands').innerHTML = BANDS.map(b=>`<button type="button" class="band ${b.cls}" data-b="${b.id}" aria-pressed="${bandOn.has(b.id)}"><div class="bn">${b.name}</div><div class="bc">–</div><div class="br">${b.range}</div></button>`).join('');
    body.innerHTML = `<tr><td colspan="9" class="empty">점수를 입력하면 여기에 대학 목록이 나와요.</td></tr>`;
    $('count').textContent = ''; more.hidden = true; return;
  }
  $('resHint').textContent = `${grade} · 내 표준점수 합 ${total}점 기준 · 지원가능점수와의 차이로 판정`;
  const fK = $('fK').value, fG = $('fG').value, q = $('fQ').value.trim().toLowerCase(), far = $('fFar').checked;
  const counts = Object.fromEntries(BANDS.map(b=>[b.id,0]));
  const list = [];
  for (const r of T.rows) {
    const [u, reg, jh, g, k, dt, dept, camp, n, std] = r;
    if (fK !== '' && k !== +fK) continue;
    if (fG !== '' && g !== +fG) continue;
    if (regionOn.size && !regionOn.has(reg)) continue;
    if (q && !(T.U[u]+' '+dept+' '+T.D[dt]+' '+camp).toLowerCase().includes(q)) continue;
    const d = total - std;
    if (!far && d > SAFE_LIMIT) continue;
    const b = BANDS.find(b=>b.test(d)); if (!b) continue;
    counts[b.id]++;
    if (bandOn.has(b.id)) list.push([r, d, b]);
  }
  $('bands').innerHTML = BANDS.map(b=>`<button type="button" class="band ${b.cls}" data-b="${b.id}" aria-pressed="${bandOn.has(b.id)}"><div class="bn">${b.name}</div><div class="bc">${counts[b.id]}</div><div class="br">${b.range}</div></button>`).join('');
  list.sort((a,b) => b[0][9]-a[0][9] || T.U[a[0][0]].localeCompare(T.U[b[0][0]],'ko'));
  $('count').textContent = `${list.length}개 모집단위 · 지원가능점수 높은 순` + (!far ? ` · 안정권은 +${SAFE_LIMIT}점까지 표시` : '');
  if (!list.length) { body.innerHTML = `<tr><td colspan="9" class="empty">조건에 맞는 모집단위가 없어요. 필터를 줄여 보세요.</td></tr>`; more.hidden = true; return; }
  body.innerHTML = list.slice(0, shown).map(([r,d,b]) => {
    const [u, reg, jh, g, k, dt, dept, camp, n, std, ex] = r;
    const extra = T.X[ex] ? `<small>${T.X[ex]}</small>` : '';
    return `<tr><td><span class="pill ${b.cls}">${b.name}</span></td>
      <td><span class="u">${T.U[u]}</span>${camp?`<div class="meta">${camp}</div>`:''}</td>
      <td class="dept">${dept}<small>${T.D[dt]} · ${T.J[jh]}</small>${extra}</td>
      <td class="meta">${GUN[g]}</td><td class="meta">${KYE[k]}</td><td class="meta">${T.R[reg]}</td>
      <td class="r">${n||'–'}</td><td class="r">${std}</td>
      <td class="r diff" style="color:var(--${b.id})">${d>0?'+':''}${d}</td></tr>`;
  }).join('');
  more.hidden = list.length <= shown;
  more.textContent = `더 보기 (${list.length - shown}개 남음)`;
}

function switchGrade(g) {
  grade = g;
  store.set('univline-grade', g);
  buildSheet();
  const saved = store.get('univline-'+g);
  const has = saved && Array.isArray(saved.vals) && saved.vals.some(v=>v!=='');
  $('sampleNote').hidden = !!has;
  writeSheet(has ? saved : sampleState());
}

// 이벤트
$('gradeTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) switchGrade(b.dataset.g); });
document.querySelector('.mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.m===mode) return;
  setMode(b.dataset.m);
  GRADES[grade].subs.forEach((_,i)=>$('in'+i).value='');
  $('sampleNote').hidden = true; recalc();
});
$('regions').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.r === 'all') regionOn.clear();
  else { const i = +b.dataset.r; regionOn.has(i) ? regionOn.delete(i) : regionOn.add(i); }
  $('regions').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed',
    x.dataset.r==='all' ? String(regionOn.size===0) : String(regionOn.has(+x.dataset.r))));
  shown = PAGE; renderList();
});
$('bands').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  bandOn.has(b.dataset.b) ? bandOn.delete(b.dataset.b) : bandOn.add(b.dataset.b);
  shown = PAGE; renderList();
});
['fK','fG','fQ','fFar'].forEach(id => $(id).addEventListener('input', ()=>{ shown = PAGE; renderList(); }));
$('moreBtn').addEventListener('click', ()=>{ shown += PAGE; renderList(); });
$('clearBtn').addEventListener('click', ()=>{ $('sampleNote').hidden = true; writeSheet({mode}); });
$('sampleBtn').addEventListener('click', ()=>{ $('sampleNote').hidden = false; writeSheet(sampleState()); });

const hashG = {g1:'고1', g2:'고2', g3:'고3'}[location.hash.slice(1)];
switchGrade(hashG || store.get('univline-grade') || '고2');
</script>

</body></html>
